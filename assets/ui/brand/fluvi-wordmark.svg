<!-- Fluvi lockup: mark + wordmark (Inter Display Bold, -0.5 tracking) on the river-bed background. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="lantern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#e0973d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="200" fill="#071419"/>
  <g transform="translate(40 36)">
    <rect width="128" height="128" rx="38" fill="url(#lantern)"/>
    <g fill="#2b1a05">
      <rect x="26" y="35" width="64" height="13" rx="6.5"/>
      <rect x="45" y="58" width="58" height="13" rx="6.5"/>
      <rect x="29" y="80" width="42" height="13" rx="6.5"/>
    </g>
  </g>
  <text x="200" y="134" font-family="Inter Display, Inter, sans-serif" font-weight="700" font-size="104" letter-spacing="-2" fill="#e6efec">Fluvi</text>
</svg>
