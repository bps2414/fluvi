<!-- Fluvi mark: a lantern-amber tile with three staggered current lines (the stream flowing left to right).
     Same geometry as .brand-mark in assets/ui/theme.rcss (40 dp tile, scaled x6.4). Source for the app icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="lantern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#e0973d"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="77" fill="url(#lantern)"/>
  <g fill="#2b1a05">
    <rect x="51" y="70" width="128" height="26" rx="13"/>
    <rect x="90" y="115" width="115" height="26" rx="13"/>
    <rect x="58" y="160" width="83" height="26" rx="13"/>
  </g>
</svg>
